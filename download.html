<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download da Imagem André</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

img{
    width:350px;
    max-width:90%;
    border-radius:12px;
    box-shadow:0 0 25px rgba(255,255,255,.2);
}

button{
    margin-top:25px;
    padding:15px 35px;
    border:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    color:#fff;
    background:#00b894;
    transition:.3s;
}

button:hover{
    background:#00d9a5;
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">

    <!-- Troque o caminho pela sua imagem -->
    <img src="andre.png" alt="Nome André" id="imagem">

    <br>

    <button onclick="baixarImagem()">
        abaixe aqui
    </button>

</div>

<script>
function baixarImagem(){

    const link = document.createElement("a");

    // Caminho da imagem
    link.href = "andre.png";

    // Nome do arquivo ao baixar
    link.download = "andre.png";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
}
</script>

</body>
</html>
