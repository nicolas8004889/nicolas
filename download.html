<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar Imagem - Tigre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            margin: 0;
        }
        .card {
            background: white;
            color: #1e2937;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 420px;
        }
        img {
            max-width: 320px;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>📥 Download da Imagem</h1>
        <p>Clique no botão para baixar o tigre em alta qualidade</p>
        
        <img src="/home/workdir/attachments/image.png" alt="Tigre">
        
        <br><br>
        <button onclick="baixarImagem()">
            ⬇️ Baixar como PNG
        </button>
    </div>

    <script>
        function baixarImagem() {
            const link = document.createElement('a');
            link.href = "/home/workdir/attachments/image.png";
            link.download = "tigre.png";        // Nome do arquivo ao baixar
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
